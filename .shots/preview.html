<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; background: #1a1a1a; font-family: "Segoe UI", sans-serif; }
  #stage { position: relative; width: 460px; height: 680px; overflow: hidden; }
  canvas { display: block; }
  textarea { position: absolute; border: none; outline: none; resize: none;
             background: transparent; box-sizing: border-box; }
</style>
</head>
<body>
<div id="stage"><canvas id="cv" width="460" height="680"></canvas></div>
<script>
// ============ 内联插件代码（构建时替换） ============
window.__PLUGIN_SRC__ = null;
</script>
<script>
// fetch 插件源码并存到全局，module 阶段使用（file:// 也能工作的备选：直接内联）
(async () => {
    try {
        const r = await fetch("../web/textnote_canvas.js");
        window.__PLUGIN_SRC__ = await r.text();
    } catch (e) {
        window.__PLUGIN_SRC__ = "FETCH_FAIL:" + e.message;
    }
    document.title = "src:" + (window.__PLUGIN_SRC__ ? window.__PLUGIN_SRC__.length : 0);
})();
</script>
<script>
// ============ 环境 mock ============
const qs = new URLSearchParams(location.search);
const FORCE_LANG = qs.get("lang");
const SCENE = qs.get("scene") || "panel";
if (FORCE_LANG) globalThis.__TEXTNOTE_LANG__ = FORCE_LANG;

let TextNoteCls = null;
const realRegister = (name, cls) => { if (name === "TextNote") TextNoteCls = cls; };

const mkStyle = () => new Proxy({}, { set(t,k,v){ t[k]=v; return true; }, get(t,k){ return t[k]; } });
class FakeTextNode {
    constructor() { this.properties = {}; this.widgets = []; this.size=[320,180]; this.flags={}; }
    addWidget(type, name, value, cb, options) {
        const w = { type, name, value, callback: cb, options: options || {},
                    inputEl: null, element: null, computeSize: undefined, hidden: false };
        this.widgets.push(w);
        return w;
    }
    setDirtyCanvas(){}
}

globalThis.LiteGraph = { registerNodeType: realRegister, NORMAL_TITLE: 0 };
globalThis.LGraphNode = FakeTextNode;
globalThis.comfyAPI = { widgets: { ComfyWidgets: {
    STRING(node, name, spec) {
        const w = node.addWidget("customtext", name, spec[1].default, ()=>{}, { multiline: true });
        return { widget: w };
    },
} } };
globalThis.app = { registerExtension(e) { e.registerCustomNodes(); } };
</script>
<script>
// 等插件源码就绪后动态 import 并渲染
(async () => {
    for (let i = 0; i < 100 && !window.__PLUGIN_SRC__; i++) {
        await new Promise(r => setTimeout(r, 50));
    }
    if (!window.__PLUGIN_SRC__ || window.__PLUGIN_SRC__.startsWith("FETCH_FAIL")) {
        document.title = "FAIL:" + window.__PLUGIN_SRC__;
        return;
    }
    let code = window.__PLUGIN_SRC__;
    code = code.replace('import { app } from "/scripts/app.js";', "const app = globalThis.app;");
    const blob = new Blob([code], { type: "text/javascript" });
    await import(URL.createObjectURL(blob));
    window.__READY__ = true;

    const node = new TextNoteCls();
    node.widgets.find(w=>w.name==="text").value = "write notes and remarks here";

    // textarea mock
    const stage = document.getElementById("stage");
    const ta = document.createElement("textarea");
    ta.value = "write notes and remarks here";
    Object.defineProperty(ta, "dataset", { value: {} });
    const frame = document.createElement("div");
    frame.style.position = "absolute";
    frame.style.borderWidth = "2px"; frame.style.borderStyle = "solid";
    stage.appendChild(frame); stage.appendChild(ta);
    node.textWidget.inputEl = ta;

    const origApply = node.applyNoteStyles.bind(node);
    node.applyNoteStyles = function() {
        origApply();
        frame.style.background = this.bgcolor;
        frame.style.borderColor = this.color === "transparent" ? this.bgcolor : this.color;
    };

    if (SCENE === "font_menu") node._toggleColorMenu(true, "font_color");
    else if (SCENE === "bg_menu") node._toggleColorMenu(true, "bg_color");
    else node._toggleSettings(true);

    // 渲染到 canvas
    const cv = document.getElementById("cv");
    const ctx = cv.getContext("2d");
    const safeCtx = new Proxy(ctx, {
        get(t, k) {
            if (k === "canvas") return cv;
            if (k === "roundRect") return (x,y,w,h,r) => {
                if (r === undefined) r = 0;
                t.beginPath();
                t.moveTo(x+r, y);
                t.arcTo(x+w, y, x+w, y+h, r);
                t.arcTo(x+w, y+h, x, y+h, r);
                t.arcTo(x, y+h, x, y, r);
                t.arcTo(x, y, x+w, y, r);
                t.closePath();
            };
            const v = t[k];
            return typeof v === "function" ? v.bind(t) : v;
        },
        set(t, k, v) { t[k] = v; return true; },
    });

    ctx.save();
    ctx.translate(10, 40);
    node.onDrawTitle(safeCtx);
    node.onDrawBackground(safeCtx);
    ctx.restore();

    // textarea 同步定位
    const previewH = node.textWidget.computeSize ? node.textWidget.computeSize()[1] : 140;
    ta.style.left = "18px"; ta.style.top = (40 + 34) + "px";
    ta.style.width = (node.size[0] - 16) + "px"; ta.style.height = previewH + "px";
    ta.style.fontSize = ta.style.fontSize || "16px";
    ta.style.color = ta.style.color || "#fff";
    frame.style.left = "14px"; frame.style.top = "44px";
    frame.style.width = node.size[0] + "px"; frame.style.height = previewH + "px";

    window.__RENDERED__ = true;
    document.title = "rendered:" + SCENE + ":" + (FORCE_LANG || "auto");
})();
</script>
</body>
</html>
